name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove any personal account data, email addresses, or Firebase tokens before submitting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 130, macOS 15
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reader / catalog
        - Auth / account
        - Journals / highlights / bookmarks
        - Search / quotes
        - PWA / offline
        - Deployment
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Remove secrets and personal data first.
      render: shell
